<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="おおきい・ちいさい">
  <title>おおきい？ ちいさい？</title>
  <link rel="stylesheet" href="./styles.css?v=1.2.3">
</head>
<body>
  <main class="game" id="game" data-phase="loading">
    <section id="stage" class="stage" aria-label="果物の大きさを見て選ぶ問題">
      <img id="fruit" class="fruit" alt="" draggable="false" hidden>
      <div id="loading" class="loading">じゅんび ちゅう…</div>
      <div id="image-error" class="image-error" hidden><p>えを よみこめませんでした</p><button id="retry-image" type="button">もういちど</button></div>
      <div id="result-mark" class="result-mark" aria-hidden="true" hidden></div>
      <div id="audio-recovery" class="audio-recovery" hidden><span>おとが でませんでした</span><button id="retry-audio" type="button">もういちど きく</button><button id="continue" type="button">すすむ</button></div>
    </section>
    <div class="answers" aria-label="大きいか小さいかを選ぶ">
      <button class="answer" id="big" data-size="big" type="button" disabled>
        <span class="size-cue-slot" aria-hidden="true"><span class="size-cue"></span></span>
        <span class="answer-label">おおきい</span>
      </button>
      <button class="answer" id="small" data-size="small" type="button" disabled>
        <span class="size-cue-slot" aria-hidden="true"><span class="size-cue size-cue-small"></span></span>
        <span class="answer-label">ちいさい</span>
      </button>
    </div>
  </main>
  <noscript>このゲームを使うには JavaScript を有効にしてください。</noscript>
  <script defer src="./game.browser.js?v=1.3.0"></script>
</body>
</html>
